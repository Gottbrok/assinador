name: release

# A release do Assinador (F7a, §3.10 do plano). Uma tag `vX.Y.Z` num commit da `main` monta os pacotes
# Linux de PRODUÇÃO e os zips das extensões para as lojas, escreve o `SHA256SUMS`, assina-o com a chave
# GPG das releases e cria a release como RASCUNHO: publicar é do Cairo, na página da release, depois de
# conferir (regra do CLAUDE.md). O MSI do Windows entra quando a F6b fechar.
#
# Sem os IDs das lojas no programa (o gerador de manifestos recusa), sem a chave pública em
# `protocolo/chave-gpg-das-releases.asc` ou sem a privada no segredo `ASSINADOR_GPG_CHAVE`, o workflow
# para: não existe release pela metade. As ações são pinadas por commit (a tag vai no comentário).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versao:
    runs-on: ubuntu-24.04
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A versão é exatamente `X.Y.Z` (a que a biblioteca compara com a versão mínima), e a tag está
      # num commit que já entrou na `main`: release de ramo não sai.
      - id: versao
        run: |
          versao="${GITHUB_REF_NAME#v}"
          if ! [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "a tag $GITHUB_REF_NAME não é vX.Y.Z" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "o commit da tag $GITHUB_REF_NAME não está na main" >&2
            exit 1
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"

  linux:
    needs: versao
    strategy:
      matrix:
        include:
          - executor: ubuntu-24.04
            arquitetura: amd64
          - executor: ubuntu-24.04-arm
            arquitetura: arm64
    runs-on: ${{ matrix.executor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: nativo/go.mod
          cache-dependency-path: nativo/go.sum

      - name: Pacotes de produção
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: instaladores/linux/empacotar.sh "$VERSAO" dist producao

      - name: Instalar e remover em contêiner, com os IDs das lojas
        run: instaladores/linux/testar-pacotes.sh dist producao

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arquitetura }}
          path: dist/*
          if-no-files-found: error

  extensoes:
    needs: versao
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extensao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensao/package-lock.json

      - run: npm ci

      # Os builds da loja (sem localhost nem a chave de desenvolvimento), montados duas vezes e
      # comparados: é o mesmo passo do `extensao.yml`, e o zip reproduzível é o que a loja do Firefox
      # confere contra o fonte.
      - name: Zips das extensões, reproduzíveis
        run: npm run reproduzivel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-extensoes
          path: extensao/pacotes/*.zip
          if-no-files-found: error

  publicar:
    needs: [versao, linux, extensoes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Somas e assinatura, conferidas como quem baixa confere
        env:
          ASSINADOR_GPG_CHAVE: ${{ secrets.ASSINADOR_GPG_CHAVE }}
          ASSINADOR_GPG_SENHA: ${{ secrets.ASSINADOR_GPG_SENHA }}
        run: instaladores/somas-e-assinatura.sh dist

      - name: Release como RASCUNHO (publicar é do Cairo)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Assinador $VERSAO" \
            --notes "Assinador $VERSAO. O que mudou está no CHANGELOG.md. Confira os arquivos com o SHA256SUMS, e o SHA256SUMS com o SHA256SUMS.asc e a chave pública de protocolo/chave-gpg-das-releases.asc."
